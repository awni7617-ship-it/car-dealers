name: Checks

on:
  pull_request:
  push:

jobs:
  test:
    # The deploy workflow already tests the default branch before it ships.
    if: github.ref_name != github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      # forecourt.html is generated: it must match the sources it came from.
      - run: npm run check
