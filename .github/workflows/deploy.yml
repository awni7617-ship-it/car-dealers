name: Deploy

# Every push to the default branch goes live. The two secrets below are all it
# takes:
#   CLOUDFLARE_API_TOKEN   — "Edit Cloudflare Workers" template, plus D1 edit
#   CLOUDFLARE_ACCOUNT_ID  — from the Cloudflare dashboard sidebar
on:
  push:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    # Whatever this repository's default branch happens to be called — naming it
    # here would quietly stop deploying the day it is renamed.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Check
        run: npm test && npm run check

      - name: Point the config at this account's resources
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run provision

      # Migrations run before the deploy: new code must never meet an old
      # schema. Every migration here only adds, so this is safe to re-run.
      - name: Apply database migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply forecourt --remote

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
