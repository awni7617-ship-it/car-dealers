name: Deploy

# Every push to the default branch goes live. The two secrets below are all it
# takes:
#   CLOUDFLARE_API_TOKEN   — "Edit Cloudflare Workers" template, plus D1 edit
#   CLOUDFLARE_ACCOUNT_ID  — from the Cloudflare dashboard sidebar
on:
  push:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    # Whatever this repository's default branch happens to be called — naming it
    # here would quietly stop deploying the day it is renamed.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Check
        run: npm test && npm run check

      # Deploying from here needs a token. Deploying from Cloudflare's own Git
      # build does not — it brings its own credentials. So when the secret is
      # absent, say so and stop: a red cross on every push would be a lie about
      # the state of the code, which passed everything above.
      - name: Are we the ones deploying?
        id: creds
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::Tests and checks passed. No CLOUDFLARE_API_TOKEN secret is set, so this workflow is not deploying. Either Cloudflare's Git build is handling deploys, or add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to deploy from here."
          fi

      # The resource ids in wrangler.jsonc are real, so this is a no-op for the
      # account they belong to; it earns its keep when deploying into a new one.
      - name: Point the config at this account's resources
        if: steps.creds.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run provision

      # Migrations run before the deploy: new code must never meet an old
      # schema. Every migration here only adds, so this is safe to re-run.
      - name: Apply database migrations
        if: steps.creds.outputs.deploy == 'true'
        env:
          CI: "true"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply forecourt --remote

      - name: Deploy
        if: steps.creds.outputs.deploy == 'true'
        env:
          CI: "true"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
